name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · boundaries · mcp · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Boundaries
        run: bun run boundaries

      - name: API docs (TSDoc coverage)
        run: bun run docs:check

      - name: MCP contract
        run: bun run mcp:check

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Test
        run: bun run test

      - name: Script tests
        run: bun run test:scripts

  e2e:
    name: browser e2e (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: packages/kit

      - name: E2E
        run: bun run e2e
        working-directory: packages/kit
