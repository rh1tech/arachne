name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · boundaries · mcp · typecheck · test
    # Our own runner on rbx1 for pushes and same-repo PRs. Pull requests from
    # forks never run on it (it shares a host with production sites): they
    # use GitHub-hosted runners, and need a maintainer's approval first.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rbx1", "arachne-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Boundaries
        run: bun run boundaries

      - name: API docs (TSDoc coverage)
        run: bun run docs:check

      - name: MCP contract
        run: bun run mcp:check

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Test
        run: bun run test

      - name: Script tests
        run: bun run test:scripts

  e2e:
    name: browser e2e (Chromium)
    # Our own runner on rbx1 for pushes and same-repo PRs. Pull requests from
    # forks never run on it (it shares a host with production sites): they
    # use GitHub-hosted runners, and need a maintainer's approval first.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "rbx1", "arachne-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      # System libraries are preinstalled on rbx1 (the runner has no sudo).
      - name: Install Chromium
        run: bunx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
        working-directory: packages/kit

      - name: E2E
        run: bun run e2e
        working-directory: packages/kit
