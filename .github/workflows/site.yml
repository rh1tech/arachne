name: Site

# After CI passes on master (or by hand): build arachne.rh1.tech, run its
# browser tests, and publish the files on rbx1. The runner lives on the same
# host and its user owns /var/www/arachne-site, so the deploy is a local
# rsync: no SSH keys or secrets.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build · test · deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, rbx1, arachne-ci]
    timeout-minutes: 20
    environment:
      name: arachne.rh1.tech
      url: https://arachne.rh1.tech
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        working-directory: apps/site

      # Chromium's system libraries are preinstalled on rbx1.
      - name: Install Chromium
        run: bunx playwright install chromium
        working-directory: apps/site

      - name: Browser tests
        run: bun run e2e
        working-directory: apps/site

      # --delay-updates: files switch over at the end, so readers never get
      # a half-updated site.
      - name: Deploy
        run: rsync -a --delete-delay --delay-updates apps/site/dist/ /var/www/arachne-site/

      - name: Check the live site
        run: |
          commit=$(git rev-parse --short HEAD)
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://arachne.rh1.tech/ | grep -q "$commit"; then
              echo "arachne.rh1.tech serves $commit"
              exit 0
            fi
            sleep 5
          done
          echo "arachne.rh1.tech doesn't show $commit" >&2
          exit 1
