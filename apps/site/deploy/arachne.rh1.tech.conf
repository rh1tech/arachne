# arachne.rh1.tech — the Arachne website (static build of apps/site).
#
# Reference copy of /etc/nginx/vhosts/arachne.rh1.tech.conf on rbx1. Content
# is deployed by rsync from apps/site/dist/ into /var/www/arachne-site.
# Cloudflare fronts nginx; the shared rh1-tech-ssl snippet rejects traffic that
# did not come through Cloudflare. Test before reloading: this host serves
# other sites, and a bad vhost takes all of them down.
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Security headers are repeated in every location that sets a header of its
# own: nginx's add_header does not inherit into a block that declares one.
server {
    server_name arachne.rh1.tech;
    access_log /var/log/nginx/arachne.rh1.tech_access.log;
    error_log  /var/log/nginx/arachne.rh1.tech_error.log;

    root /var/www/arachne-site;
    index index.html;

    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Shiki colours code with inline style attributes, hence 'unsafe-inline' for styles only.
    # Cloudflare injects its Web Analytics beacon (script + reports to cloudflareinsights.com).
    set $csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Pages are dist/<path>/index.html, served without a trailing-slash
    # redirect (links and canonical URLs have none). Unknown paths get 404.html, which the
    # client hydrates as the not-found page.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
    error_page 404 /404.html;

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # HTML, page data and the search index change with every deploy.
    location ~ (\.html|\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Content-hashed bundles never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /fonts/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    listen 443 ssl;
    include /etc/nginx/snippets/rh1-tech-ssl.conf;
}
server {
    if ($host = arachne.rh1.tech) { return 301 https://$host$request_uri; }
    server_name arachne.rh1.tech;
    listen 80;
    return 404;
}
